<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  <rect width="512" height="512" rx="128" fill="url(#grad2)" />
  
  <!-- Outer subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Central ERP / Supply Tracker Graphic -->
  <g filter="url(#shadow)">
    <!-- 3D Layered Isometric Box / Warehouse Symbol -->
    <!-- Base Platform -->
    <path d="M256 120 L380 190 L256 260 L132 190 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M132 190 L256 260 L256 390 L132 320 Z" fill="#e0e7ff" />
    <path d="M380 190 L256 260 L256 390 L380 320 Z" fill="#c7d2fe" />
    
    <!-- Inner Accent Details -->
    <!-- Chart Arrow Rising -->
    <path d="M190 310 L256 230 L310 270 L350 200" fill="none" stroke="#4f46e5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="350,185 365,215 335,210" fill="#4f46e5" />
    
    <!-- Currency / Checkmark Badge -->
    <circle cx="256" cy="380" r="42" fill="#10b981" />
    <path d="M242 380 L252 390 L272 370" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
